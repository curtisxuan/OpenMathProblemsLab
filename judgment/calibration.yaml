# Calibration Cases — SOURCE, git-tracked (ADR-0006).
#
# Conjectures whose real outcome is already known, run blind through the rubric
# to test whether the Axes predict anything. Because Verdicts will not
# accumulate (ADR-0007), this set carries the ENTIRE calibration load.
#
# Half should be positive controls (settled by explicit construction or
# exhaustive search — the rubric should rate these highly) and half negative
# controls (combinatorial-looking, decades old, still open — the rubric should
# not). If the rubric files Hadwiger under "attack now", it is broken.
#
# EVERY case must carry an outcome_source that was actually checked. Do not
# populate outcome_detail from recollection: a miscalibrated calibration set is
# worse than none, because it launders a wrong rubric as a validated one.
#
# The entries below are CANDIDATES, deliberately left unverified and inactive.
# Set `verified: true` and fill outcome_source only after checking the primary
# reference. Loader skips anything with `verified: false`.

cases:
