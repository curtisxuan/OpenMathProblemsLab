  # --- gold-standard positive controls -------------------------------------
  # Found while hand-checking the extraction prompt against a 20-paper sample.
  # These two are the best controls in the set, for three reasons:
  #   1. They are from our exact target categories (math.CO, algebraic combinatorics).
  #   2. They were settled by explicit example — the shape the Gate is built to find.
  #   3. They were settled BY A LANGUAGE MODEL searching for counterexamples,
  #      which is the precise mechanism this project exists to aim.
  # Both are verified against a primary source we have actually read, rather
  # than recalled: arXiv:2607.21508v1, cached at cache/src/.
  #
  # These enable, for free, the retrospective backtest that was rejected as too
  # expensive during design: run the rubric on each conjecture AS STATED BEFORE
  # July 2026 and check whether it would have ranked them worth attacking. We
  # know the answer. If the rubric says "deep machinery, heavy attention, skip",
  # it is not merely uncalibrated — it is anti-predictive on the one case where
  # the ground truth is unambiguous.

  - slug: stanley-claw-free-s-positivity
    name: Stanley's claw-free Schur-positivity conjecture
    statement: >-
      If G is claw-free, then the chromatic symmetric function X_G is
      s-positive (expands with non-negative coefficients in the Schur basis).
    known_outcome: settled_by_witness
    outcome_detail: >-
      FALSE. Refuted July 2026 by two explicit counterexamples: the line graphs
      G_1 = L(H_1) and G_2 = L(H_2), each on 12 vertices (22 and 21 edges),
      with [s_3333] X_G equal to -64 and -40 respectively. Line graphs are
      claw-free, so both are counterexamples. Conjectured by Stanley in 1995.
      The counterexamples were found by ChatGPT-5.6 Sol Pro, in a session of
      roughly 83 minutes, partly using SAT solvers.
    outcome_source: "arXiv:2607.21508v1, Matherne & Morales, sections 2 and 4"
    expected_gate_pass: 1
    verified: true
    notes: >-
      Expected axis profile before refutation: finite witness YES (a graph on
      n vertices, checkable by computing one Schur expansion); quantifier form
      UNIVERSAL, so one counterexample kills it; machinery MODERATE. Attention
      was the trap — thirty years old with a large literature, which our
      Attention axis reads as evidence against tractability. It was wrong here.
      Watch whether the rubric over-weights Attention on this case.

  - slug: monical-snp
    name: Monical's SNP conjecture for chromatic symmetric functions
    statement: >-
      If X_G is s-positive, then X_G(x_1, ..., x_k) has saturated Newton
      polytope (SNP) for every k.
    known_outcome: settled_by_witness
    outcome_detail: >-
      FALSE. Refuted July 2026 by an explicit bipartite graph G_3 on 12
      vertices with 19 edges: X_{G_3} is s-positive, yet proper colorings exist
      of weight (6,6,0) and (8,2,2) but not of the average (7,4,1), so the
      Newton polytope is unsaturated. Conjectured by Monical in 2018
      (Conjecture 2.37 of her thesis). Found by ChatGPT-5.6 Sol Pro on the
      first prompt, after roughly 37 minutes.
    outcome_source: "arXiv:2607.21508v1, Matherne & Morales, sections 3 and 4"
    expected_gate_pass: 1
    verified: true
    notes: >-
      The single best test of the Frontier axis in the whole set. Prior work
      (MMS, section 7.4) had established that any counterexample needs n >= 12
      vertices, and the paper quotes this directly. That is exactly the kind of
      paper-sourced Frontier claim ADR-0005 requires — a known lower bound that
      says where to point a search. The search then succeeded at n = 12. If the
      rubric records frontier_status 'known' with that quote and rates the
      search space reachable, the axis is doing its job.

  # --- from Pilot Attacks --------------------------------------------------
  # Outcomes of manual attacks get appended here with from_pilot_attack: true.
  # An attack that is run but not recorded evaporates (ADR-0007).
